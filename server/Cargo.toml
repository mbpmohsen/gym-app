[package]
name = "gym-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["getrandom"] }
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
bytes = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std", "chrono"] }
rust_xlsxwriter = "0.99.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
